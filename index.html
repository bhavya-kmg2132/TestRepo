<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample Page 2 - Contact Form</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; margin: 0; padding: 40px 20px; }
    form { max-width: 420px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; padding: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #333; font-size: 1.6rem; }
    label { display: block; margin-top: 14px; font-weight: bold; color: #555; }
    input, textarea { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 20px; width: 100%; padding: 10px; background: #2e8b57; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #256d45; }
  </style>
</head>
<body>
  <form>
    <h1>Contact Us</h1>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Your name">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">
    <label for="message">Message</label>
    <textarea id="message" rows="4" placeholder="Your message"></textarea>
    <button type="submit">Send</button>
  </form>
</body>
</html>
